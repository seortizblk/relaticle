; xdebug — development only.
;
; Every value is `${VAR}`: PHP expands environment variables in ini files but
; has no shell-style defaults, so the variables are set in the image and can be
; overridden from docker/.env.dev (PHP_XDEBUG_MODE=off disables xdebug
; completely, which is the fastest way to see whether it is the culprit).
;
; Step debugging is trigger-based (XDEBUG_TRIGGER / `xdebug_break()`), so
; requests stay fast until a client is actually listening.

[xdebug]
xdebug.mode = ${PHP_XDEBUG_MODE}
xdebug.start_with_request = ${PHP_XDEBUG_START_WITH_REQUEST}
xdebug.client_host = ${PHP_XDEBUG_CLIENT_HOST}
xdebug.client_port = ${PHP_XDEBUG_CLIENT_PORT}
xdebug.idekey = ${PHP_XDEBUG_IDEKEY}
xdebug.discover_client_host = false
xdebug.log_level = 0
