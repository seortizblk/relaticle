; Relaticle — development overrides.
;
; Loaded after the image's own /usr/local/etc/php/conf.d files, because of the
; "zz-" prefix.
;
; PHP expands ${VAR} from the environment inside ini files, but it does NOT
; understand the shell "${VAR:-default}" form — an unset variable leaves the
; directive empty. PHP_MEMORY_LIMIT, PHP_DISPLAY_ERRORS and PHP_OPCACHE_ENABLE
; are already wired that way by the base image; the values below have no
; PHP_* equivalent over there.

error_reporting = E_ALL

; No opcode cache in development: it hides edits, and pest/xdebug want the
; files fresh on every run.
opcache.enable = 0
opcache.enable_cli = 0

; `assert()` and the framework's assertions stay live.
zend.assertions = 1
assert.exception = 1
